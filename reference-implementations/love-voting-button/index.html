<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Heart effect example</title>
        <style>
            :root {
                --bg: #ffffff;
                --fg: #18181b;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                min-height: 100%;
            }

            body {
                background: var(--bg);
                color: var(--fg);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    Arial,
                    sans-serif;
                display: grid;
                place-items: center;
                min-height: 100vh;
            }

            /* heartPop: the bounce/pop applied to the button itself */
            @keyframes heartPop {
                0% {
                    transform: scale(1);
                }
                15% {
                    transform: scale(1.35);
                }
                30% {
                    transform: scale(0.9);
                }
                45% {
                    transform: scale(1.2);
                }
                60% {
                    transform: scale(1);
                }
            }

            /* heartParticleBurst: the scatter for each spawned particle */
            @keyframes heartParticleBurst {
                0% {
                    opacity: 1;
                    transform: translate(0, 0) scale(1);
                }
                100% {
                    opacity: 0;
                    transform: translate(var(--tx), var(--ty)) scale(0);
                }
            }

            .heart-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                padding: 0;
                border: 1px solid #e4e4e7;
                border-radius: 9999px;
                background: #ffffff;
                color: #52525b;
                font: inherit;
                cursor: pointer;
                overflow: visible;
                transition:
                    border-color 0.2s,
                    color 0.2s;
            }

            .heart-btn:hover {
                border-color: #d4d4d8;
                color: #18181b;
            }

            .heart-btn.filled {
                border-color: #f43f5e;
                background: #f43f5e;
                color: #ffffff;
            }

            .heart-btn.pop {
                animation: heartPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            /* particles are fixed to the viewport at the click point */
            .heart-particle {
                position: fixed;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                animation: heartParticleBurst 0.7s ease-out forwards;
            }
        </style>
    </head>
    <body>
        <button id="heart" class="heart-btn" aria-pressed="false" title="Favorite">
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
                />
            </svg>
        </button>

        <script>
            const btn = document.getElementById("heart");
            const svg = btn.querySelector("svg");
            let filled = false;

            const PARTICLE_COLORS = ["#f43f5e", "#fb7185", "#fda4af", "#e11d48", "#f43f5e"];

            function burst(x, y) {
                const count = 10;
                for (let i = 0; i < count; i++) {
                    const el = document.createElement("span");
                    el.className = "heart-particle";
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
                    const distance = 32 + Math.random() * 40;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance - 10;
                    el.style.setProperty("--tx", tx + "px");
                    el.style.setProperty("--ty", ty + "px");
                    el.style.left = x + "px";
                    el.style.top = y + "px";
                    el.style.background = PARTICLE_COLORS[i % PARTICLE_COLORS.length];
                    document.body.appendChild(el);
                    setTimeout(() => {
                        if (el.parentNode) el.parentNode.removeChild(el);
                    }, 700);
                }
            }

            btn.addEventListener("click", () => {
                filled = !filled;
                btn.classList.toggle("filled", filled);
                btn.setAttribute("aria-pressed", String(filled));
                svg.setAttribute("fill", filled ? "currentColor" : "none");

                btn.classList.remove("pop");
                void btn.offsetWidth; // restart the animation
                btn.classList.add("pop");

                const rect = btn.getBoundingClientRect();
                burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            });
        </script>
    </body>
</html>
